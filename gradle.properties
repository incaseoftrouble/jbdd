org.gradle.caching=true

# Deliberately off: it snapshots the task graph, so -Djbdd.* forwarded to the test JVM (see
# build.gradle.kts) is captured once and every later run silently reuses the first run's values.
# A switch then appears to have no effect, which quietly invalidates any A/B run it is used for.
# It saves a second or two on a build whose tests take minutes - not worth it.
org.gradle.configuration-cache=false
