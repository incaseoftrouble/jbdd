name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'

jobs:
  check:
    name: Compile, lint, javadoc, benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      # Also validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build jmhClasses -x test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: build/reports/
          if-no-files-found: ignore

  test:
    name: Test suite on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The baseline the library targets, and the JDK it is built with.
        java: [ '11', '21' ]
    steps:
      - uses: actions/checkout@v7
      # The last version listed is the default JAVA_HOME, which runs Gradle.
      - uses: actions/setup-java@v6
        with:
          java-version: |
            ${{ matrix.java }}
            ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: >-
          ./gradlew test
          -Pjbdd.test.java=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            build/reports/tests/
            build/test-results/
            **/hs_err_pid*.log
          if-no-files-found: ignore
